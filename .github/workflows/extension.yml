name: Extension build & package

on:
  push:
    branches: ["**"]
    paths: ["extension/**"]
  pull_request:
    branches: ["**"]
    paths: ["extension/**"]

defaults:
  run:
    working-directory: extension

jobs:
  build:
    name: Type-check, bundle & package .vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Bundle (production)
        run: node esbuild.mjs --production

      - name: Package .vsix
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: rai-ide-vsix
          path: extension/*.vsix
          if-no-files-found: error
